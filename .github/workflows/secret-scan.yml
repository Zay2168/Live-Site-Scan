name: Secret scan (source)
 
# Scans every push and pull request for committed secrets using Gitleaks.
# Fails the check (and GitHub emails you) if anything is found.
 
on:
  push:
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan history too, not just the latest commit
 
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repo belongs to a GitHub organization:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
