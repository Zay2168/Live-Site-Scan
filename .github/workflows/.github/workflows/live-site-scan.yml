
name: Secret scan (live site)
 
# Crawls the deployed site and checks for exposed keys, sensitive files and risky links.
# Runs after pushes to main (once the deploy has had time to finish), weekly, and on demand.
#
# Setup: Settings -> Secrets and variables -> Actions -> Variables tab
#        add a repository variable named SITE_URL, e.g. https://yourname.github.io/your-repo/
 
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1"   # Mondays, 14:00 UTC
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  scan-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (for the scanner script)
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Wait for deploy to finish (push runs only)
        if: github.event_name == 'push'
        run: sleep 120
 
      - name: Crawl and scan the live site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL repository variable is not set"; exit 2
          fi
          python scripts/scan_site.py "$SITE_URL" | tee scan-report.txt
 
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: scan-report.txt
 
